<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">FedCCH teaser</title>
  <desc id="desc">Decorative cover for the FedCCH publication.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>
  <rect width="640" height="420" rx="28" fill="url(#bg)" />
  <rect x="36" y="34" width="568" height="352" rx="26" fill="url(#panel)" />
