  <text x="68" y="156" font-size="44" font-weight="700" font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">FedCCH</text>
  <text x="68" y="198" font-size="21" font-family="Arial, Helvetica, sans-serif" fill="#dcfce7">Personalized graph federated learning</text>
  <text x="68" y="228" font-size="21" font-family="Arial, Helvetica, sans-serif" fill="#dcfce7">for inter- and intra-client heterogeneity</text>
  <g transform="translate(350 92)">
