<script>
    $(document).ready(function () {
        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function extractScholarUserId(data) {
            if (data['scholar_id']) return data['scholar_id'];
            if (data['author_id']) return data['author_id'];

            var publications = data['publications'] || {};
            var firstPubId = Object.keys(publications)[0];
            if (firstPubId && firstPubId.indexOf(':') !== -1) {
                return firstPubId.split(':')[0];
            }

            return null;
        }

        function updateScholarLinks(data) {
            var scholarUserId = extractScholarUserId(data);
            var profileUrl = data['profile_url'] || (scholarUserId ? 'https://scholar.google.com/citations?user=' + scholarUserId : null);
            if (!profileUrl) return;
            var scholarLinks = document.getElementsByClassName('author_google_scholar_link');

            Array.prototype.forEach.call(scholarLinks, function (element) {
                element.setAttribute('href', profileUrl);
            });
        }

        function renderSelectedPublications(data) {
            var publicationList = document.getElementById('selected-publications-list');
            if (!publicationList) return;

            var publications = Object.values(data['publications'] || {});
            if (!publications.length) {
                publicationList.innerHTML = '<p class="pub-list-empty">No publications found in Google Scholar yet.</p>';
                return;
            }

            publications.sort(function (a, b) {
                var yearA = parseInt((a.bib && a.bib.pub_year) || '0', 10);
                var yearB = parseInt((b.bib && b.bib.pub_year) || '0', 10);
                if (yearA !== yearB) return yearB - yearA;
                return (b.num_citations || 0) - (a.num_citations || 0);
            });

            var selectedPublications = publications.slice(0, 5);
            var fallbackImage = "{{ '/images/500x300.png' | relative_url }}";

            publicationList.innerHTML = selectedPublications.map(function (publication) {
                var bib = publication.bib || {};
                var paperId = publication.author_pub_id || '';
                var scholarUserId = paperId.indexOf(':') !== -1 ? paperId.split(':')[0] : extractScholarUserId(data);
                var scholarDetailUrl = scholarUserId && paperId
                    ? 'https://scholar.google.com/citations?view_op=view_citation&hl=en&user=' + scholarUserId + '&citation_for_view=' + encodeURIComponent(paperId)
                    : null;
                var citedByUrl = publication.citedby_url ? 'https://scholar.google.com' + publication.citedby_url : null;
                var paperUrl = publication.pub_url || publication.eprint_url || null;
                var venue = bib.venue || bib.journal || bib.booktitle || '';
                var year = bib.pub_year || '';
                var authors = bib.author || '';
                var summary = bib.citation || venue;

                var links = [];
                if (scholarDetailUrl) links.push('<a href="' + scholarDetailUrl + '" target="_blank" rel="noopener">Scholar</a>');
                if (paperUrl) links.push('<a href="' + paperUrl + '" target="_blank" rel="noopener">Paper</a>');
                if (citedByUrl) links.push('<a href="' + citedByUrl + '" target="_blank" rel="noopener">Cited by ' + (publication.num_citations || 0) + '</a>');
                else if (typeof publication.num_citations !== 'undefined') links.push('<span>Cited by ' + publication.num_citations + '</span>');

                return [
                    '<div class="paper-box">',
                        '<div class="paper-box-image">',
                            '<div>',
                                year ? '<div class="badge">' + escapeHtml(year) + '</div>' : '',
                                '<img src="' + fallbackImage + '" alt="Publication thumbnail" width="100%">',
                            '</div>',
                        '</div>',
                        '<div class="paper-box-text">',
                            '<h3 class="publication-title">' + (scholarDetailUrl
                                ? '<a href="' + scholarDetailUrl + '" target="_blank" rel="noopener">' + escapeHtml(bib.title || 'Untitled publication') + '</a>'
                                : escapeHtml(bib.title || 'Untitled publication')) + '</h3>',
                            authors ? '<p class="publication-authors">' + escapeHtml(authors) + '</p>' : '',
                            (venue || year) ? '<p class="publication-meta">' + escapeHtml([venue, year].filter(Boolean).join(' · ')) + '</p>' : '',
                            links.length ? '<p class="publication-links">' + links.join(' <span class="pub-sep">|</span> ') + '</p>' : '',
                            summary ? '<p class="publication-summary">' + escapeHtml(summary) + '</p>' : '',
                        '</div>',
                    '</div>'
                ].join('');
            }).join('');
        }

        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json", function (data) {
            var totalCitation = data['citedby'];
            var totalCitationElement = document.getElementById('total_cit');
            if (totalCitationElement) {
                totalCitationElement.innerHTML = totalCitation;
            }

            updateScholarLinks(data);
            renderSelectedPublications(data);

            var citationEles = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationEles, function (element) {
                var paperId = element.getAttribute('data');
                var publication = (data['publications'] || {})[paperId];
                if (!publication) return;
                var numCitations = publication['num_citations'];
                element.innerHTML = '| Citations: ' + numCitations;
            });
        });
    })
</script>
